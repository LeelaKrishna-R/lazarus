poll_interval_seconds: 60
debounce: 2
alerting:
  webhook: ${DISCORD_WEBHOOK_URL}
hosts:
  - name: friday-nuc
    address: friday.example.com
    ssh_user: krishna
    checks:
      - type: reachable
        port: 7777
        timeout_seconds: 5
      - type: http_health
        url: https://friday.example.com/health
        timeout_seconds: 5
      - type: service
        name: friday
        timeout_seconds: 10
      - type: disk           # ssh <host> df -P <path>; over max_percent = unhealthy
        path: /
        max_percent: 90
      - type: memory         # ssh <host> cat /proc/meminfo; used past max_percent = unhealthy
        max_percent: 90
      - type: load           # ssh <host> 5-minute load as a percent of its cores
        max_percent: 90
    remediation:
      - on: service_down
        service: friday
        action: "systemctl restart friday"
        max_attempts: 2
        cooldown_seconds: 300
